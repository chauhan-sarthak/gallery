<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Intro Section -->
    <section id="intro">
        <h1>Welcome to my gallery, mtfker</h1>
        <p>Art, articles, and music all in one place.</p>
        <button id="playBtn">Play Intro Song</button>
        <audio id="introSong" src="intro.mp3" autoplay></audio>
    </section>

    <!-- Articles Teaser -->
    <section id="articles">
        <h2>Latest Articles</h2>
        <div class="article-teaser">Article 1 teaser...</div>
        <div class="article-teaser">Article 2 teaser...</div>
        <div class="article-teaser">Article 3 teaser...</div>
    </section>

    <!-- Art Gallery -->
    <section id="art">
        <h2>Artwork</h2>
        <div class="art-grid">
            <img src="art1.jpg" alt="Artwork 1">
            <img src="art2.jpg" alt="Artwork 2">
            <img src="art3.jpg" alt="Artwork 3">
        </div>
    </section>

    <!-- Music & Videos -->
    <section id="media">
        <h2>Music & Videos</h2>
        <div class="media-grid">
            <p>Placeholder for music/video 1</p>
            <p>Placeholder for music/video 2</p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
